app:
  name: CiteGuard-Energy
  description: 防捏造引用的空調／資料中心節能文獻調研工作流：知識庫 + OpenAlex 兩路檢索，報告每句附 [KB-x]/[OA-x]，自動剔除不存在的引用。
  icon: 🛡️
  icon_background: '#D1FADF'
  mode: workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: start-source-decompose-target
      source: start
